<!-- Automated Business Toolkit — landing page -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="description" content="Automated Business Toolkit — beginner-friendly lessons, step-by-step automations, and copy-ready AI prompts for small business owners.">
<title>Automated Business Toolkit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23d9efff'/%3E%3Cstop offset='1' stop-color='%231f6fe0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M17 5L8 18h7l-1 9 9-13h-7z' fill='%2303101f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070d; --bg2:#0a1224; --bg3:#0d1830;
  --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.08);
  --line:rgba(190,215,255,.14); --line2:rgba(190,215,255,.28);
  --blue:#8ccbff; --blue2:#4aa3ff; --blue3:#1f6fe0;
  --silver:#cfdbea; --white:#f6f9ff; --muted:#9fb2c9;
  --mint:#5ee6c8; --amber:#ffd27a; --red:#ff7b8f;
  --r:18px; --r2:12px;
  --display:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --nav-h:70px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--white);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
img,svg{-webkit-user-drag:none}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
strong{color:var(--white);font-weight:700}
mark{background:rgba(140,203,255,.16);color:var(--blue);border-radius:5px;padding:0 4px;font-weight:600}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}

/* ── Aurora background ── */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;will-change:transform}
.aurora i:nth-child(1){width:60vmax;height:60vmax;left:-20vmax;top:-25vmax;background:radial-gradient(circle,#1f6fe0 0%,transparent 65%);animation:drift1 22s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:50vmax;height:50vmax;right:-20vmax;top:20vh;background:radial-gradient(circle,#4aa3ff 0%,transparent 60%);opacity:.32;animation:drift2 26s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:45vmax;height:45vmax;left:10vw;bottom:-25vmax;background:radial-gradient(circle,#a9c8ee 0%,transparent 60%);opacity:.18;animation:drift3 30s ease-in-out infinite alternate}
.aurora::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(200,225,255,.09) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(180deg,#000 0%,transparent 75%);-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 75%)}
@keyframes drift1{to{transform:translate(12vw,10vh) scale(1.1)}}
@keyframes drift2{to{transform:translate(-14vw,-8vh) scale(1.15)}}
@keyframes drift3{to{transform:translate(10vw,-12vh) scale(.9)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.wrap{position:relative;z-index:1}

/* ── Type ── */
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.02em;line-height:1.12;color:var(--white)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.grad{background:linear-gradient(100deg,#fff 0%,#cfe8ff 45%,#8ccbff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)}

/* ── 3D buttons ── */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--body);font-weight:800;font-size:15px;letter-spacing:.01em;padding:15px 24px;border-radius:14px;transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s;user-select:none;text-align:center;line-height:1.2}
.btn-primary{color:#03101f;background:linear-gradient(180deg,#d9efff 0%,#8ccbff 45%,#4aa3ff 100%);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 -3px 0 rgba(10,60,140,.35) inset,0 6px 0 #1a5bb8,0 14px 30px rgba(74,163,255,.38)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 -3px 0 rgba(10,60,140,.35) inset,0 8px 0 #1a5bb8,0 20px 40px rgba(74,163,255,.48)}
.btn-primary:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 1px 0 #1a5bb8,0 6px 14px rgba(74,163,255,.3)}
.btn-ghost{color:var(--white);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid var(--line2);box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 4px 0 rgba(0,0,0,.45),0 10px 22px rgba(0,0,0,.3)}
.btn-ghost:hover{transform:translateY(-2px);border-color:rgba(190,215,255,.45)}
.btn-ghost:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 1px 0 rgba(0,0,0,.45)}
.btn-sm{padding:10px 16px;font-size:13px;border-radius:11px}
.btn-block{width:100%}
.shine{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.shine::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}

/* ── Cards / chips ── */
.card{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 18px 40px rgba(0,0,0,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--silver);background:rgba(255,255,255,.05);border:1px solid var(--line);transition:all .18s}
.chip:hover{border-color:var(--line2);color:var(--white)}
.chip.on{color:#03101f;background:linear-gradient(180deg,#d9efff,#8ccbff);border-color:transparent;box-shadow:0 4px 14px rgba(140,203,255,.35)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:rgba(140,203,255,.12);color:var(--blue);border:1px solid rgba(140,203,255,.25)}
.badge.mint{background:rgba(94,230,200,.12);color:var(--mint);border-color:rgba(94,230,200,.3)}
.badge.amber{background:rgba(255,210,122,.12);color:var(--amber);border-color:rgba(255,210,122,.3)}
.ico{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── Flow visual ── */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.flow .node{display:inline-flex;align-items:center;gap:8px;padding:10px 13px;border-radius:12px;font-size:13px;font-weight:700;background:rgba(10,20,40,.7);border:1px solid var(--line2);color:var(--white);box-shadow:0 1px 0 rgba(255,255,255,.08) inset}
.flow .node:first-child{border-color:rgba(255,210,122,.5);background:rgba(255,210,122,.08)}
.flow .node b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:11px;background:rgba(140,203,255,.18);color:var(--blue);font-family:var(--display)}
.flow .node:first-child b{background:rgba(255,210,122,.2);color:var(--amber)}
.flow .arr{color:var(--blue);opacity:.8;display:inline-flex}

/* ── Template / prompt block ── */
.tpl{position:relative;background:rgba(3,8,18,.75);border:1px solid var(--line);border-radius:var(--r2);padding:16px 16px 60px;font-size:14.5px;line-height:1.7;color:var(--silver);white-space:pre-wrap;word-wrap:break-word}
.tpl .copy{position:absolute;right:12px;bottom:12px}
.copy.done{color:#03251e!important;background:linear-gradient(180deg,#b8fff0,#5ee6c8)!important;border-color:transparent!important}

/* ── Toast ── */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:999;padding:11px 20px;border-radius:999px;font-weight:800;font-size:14px;color:#03251e;background:linear-gradient(180deg,#b8fff0,#5ee6c8);box-shadow:0 10px 30px rgba(94,230,200,.35);transition:all .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}

/* ── Inputs ── */
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;font-weight:700;color:var(--silver);margin-bottom:6px}
.input{width:100%;font-family:var(--body);font-size:16px;color:var(--white);background:rgba(3,8,18,.7);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(140,203,255,.18)}
textarea.input{min-height:96px;resize:vertical;line-height:1.5}

/* ── Calculator ── */
.calc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.calc-out{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:rgba(3,8,18,.6);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:24px;color:var(--white);line-height:1.1}
.stat small{font-size:11.5px;color:var(--muted);font-weight:600}
@media (max-width:520px){.calc-grid{grid-template-columns:1fr}}

/* ══════════ LANDING ══════════ */
.lnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(5,7,13,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:16px;color:var(--white);letter-spacing:-.01em}
.logo-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#d9efff,#4aa3ff 60%,#1f6fe0);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 4px 0 #154a99,0 8px 18px rgba(74,163,255,.4);color:#03101f}
.logo-mark svg{width:18px;height:18px;stroke:#03101f;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.logo small{display:block;font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--blue);text-transform:uppercase}

.sec{position:relative;padding:72px 20px 88px}
.sec.alt{background:var(--bg2)}
.sec.alt2{background:var(--bg3)}
.inner{max-width:1080px;margin:0 auto}
.sec-head{text-align:center;max-width:680px;margin:0 auto 36px}
.sec-head h2{font-size:clamp(28px,6vw,42px);margin:10px 0 12px}
.sec-head p{color:var(--muted);font-size:17px}

/* shaped gradient transitions (no straight lines) */
.wave{position:absolute;left:0;right:0;bottom:-1px;height:90px;pointer-events:none;line-height:0}
.wave svg{width:100%;height:100%;display:block}

.hero{padding:56px 20px 110px}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(36px,8.6vw,64px);font-weight:800;margin:16px 0 18px}
.hero p.lead{font-size:clamp(17px,3.8vw,20px);color:var(--silver);max-width:560px;margin-bottom:28px}
.hero-ctas{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:26px}
.trust{display:flex;flex-wrap:wrap;gap:10px 18px;color:var(--muted);font-size:14px;font-weight:600}
.trust span{display:inline-flex;align-items:center;gap:7px}
.trust .ico{width:17px;height:17px;color:var(--mint)}

.demo{position:relative;padding:22px}
.demo-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.demo-dots{display:flex;gap:6px}.demo-dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18)}
.demo-step{position:relative;display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:rgba(3,8,18,.6);border:1px solid var(--line);margin-bottom:12px;opacity:.45;transform:scale(.98);transition:all .5s cubic-bezier(.22,.9,.36,1)}
.demo-step.live{opacity:1;transform:scale(1);border-color:rgba(140,203,255,.55);box-shadow:0 0 0 1px rgba(140,203,255,.2),0 10px 30px rgba(74,163,255,.18)}
.demo-step .dic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:rgba(140,203,255,.14);color:var(--blue);flex-shrink:0}
.demo-step h4{font-family:var(--body);font-size:14.5px;font-weight:800}
.demo-step p{font-size:12.5px;color:var(--muted)}
.demo-step .ok{margin-left:auto;color:var(--mint);opacity:0;transition:opacity .3s}
.demo-step.live .ok{opacity:1}
.demo-foot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-top:6px}

.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pain h3{font-size:18px;margin:12px 0 6px}
.pain p{color:var(--muted);font-size:15px}
.pain .pic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,123,143,.12);color:var(--red)}

.how{position:relative;text-align:left}
.how .num{font-family:var(--display);font-size:13px;font-weight:800;color:#03101f;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(180deg,#d9efff,#8ccbff);box-shadow:0 4px 0 #1a5bb8}
.how h3{font-size:19px;margin:16px 0 8px}
.how p{color:var(--muted);font-size:15px}

.inside .big{font-family:var(--display);font-size:42px;font-weight:800;line-height:1}
.inside{padding:0;overflow:hidden}
.inside>.big,.inside>h3,.inside>p{padding:0 20px}
.inside>.big{padding-top:18px}
.inside>p{padding-bottom:22px}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:#0a1224}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.02);transition:transform .8s cubic-bezier(.22,.9,.36,1)}
.inside:hover .thumb img{transform:scale(1.07)}
.thumb::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:46%;background:linear-gradient(180deg,transparent,rgba(13,24,48,.92));pointer-events:none}
.inside h3{font-size:17px;margin:8px 0 6px}
.inside p{color:var(--muted);font-size:14.5px}

.lesson-row{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);margin-bottom:10px}
.lesson-row .n{font-family:var(--display);font-weight:800;font-size:14px;color:var(--blue);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(140,203,255,.12);flex-shrink:0}
.lesson-row h4{font-family:var(--body);font-size:15.5px;font-weight:800}
.lesson-row p{font-size:13.5px;color:var(--muted)}
.lesson-row .lk{margin-left:auto;color:var(--muted);flex-shrink:0}
.locked-lines{margin-top:14px}
.locked-lines i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,rgba(190,215,255,.16),rgba(190,215,255,.05));margin-bottom:8px}
.locked-lines i:nth-child(2){width:86%}.locked-lines i:nth-child(3){width:64%}
.lockpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);margin-top:12px}
.lockpill .ico{width:15px;height:15px}

.who li{list-style:none;display:flex;gap:12px;align-items:flex-start;padding:10px 0;color:var(--silver);font-size:15.5px}
.who li .ico{color:var(--mint);margin-top:3px}
.who li.no .ico{color:var(--red)}

.faq-item{border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:10px;overflow:hidden}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px;font-weight:800;font-size:15.5px;text-align:left;color:var(--white)}
.faq-q .ico{transition:transform .3s;color:var(--blue)}
.faq-item.open .faq-q .ico{transform:rotate(45deg)}
.faq-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.faq-item.open .faq-a{grid-template-rows:1fr}
.faq-a>div{overflow:hidden}
.faq-a p{padding:0 18px 18px;color:var(--muted);font-size:15px}

.price-card{max-width:460px;margin:0 auto;text-align:center;padding:32px 26px;position:relative;overflow:hidden}
.price-card::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(140deg,#d9efff,rgba(140,203,255,.2) 40%,rgba(140,203,255,.6));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.price{font-family:var(--display);font-size:64px;font-weight:800;line-height:1;margin:14px 0 4px}
.price sup{font-size:26px;vertical-align:top;position:relative;top:10px;color:var(--blue)}
.price-list{list-style:none;text-align:left;margin:22px 0 26px}
.price-list li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;color:var(--silver);font-size:15px}
.price-list .ico{color:var(--mint);margin-top:2px}
.secure{margin-top:14px;font-size:13px;color:var(--muted);display:flex;gap:6px;justify-content:center;align-items:center}
.secure .ico{width:15px;height:15px}

.lfoot{padding:40px 20px 120px;text-align:center;color:var(--muted);font-size:13.5px}
.lfoot button{color:var(--blue);font-weight:700;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}

.sticky{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;display:flex;align-items:center;gap:14px;padding:10px 10px 10px 18px;border-radius:18px;background:rgba(8,14,28,.9);border:1px solid var(--line2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 40px rgba(0,0,0,.5);transform:translateY(140%);transition:transform .45s cubic-bezier(.34,1.56,.64,1);max-width:560px;margin:0 auto;padding-bottom:calc(10px + env(safe-area-inset-bottom)*.4)}
.sticky.show{transform:translateY(0)}
.sticky .sp{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.sticky .sp small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--muted)}
.sticky .btn{flex:1}

.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.22,.9,.36,1)}
.reveal.in{opacity:1;transform:none}

/* Modal */
.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(2,4,9,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.modal .card{width:100%;max-width:400px;text-align:center;padding:28px 22px}
.modal h3{font-size:22px;margin:12px 0 8px}
.modal p{color:var(--muted);font-size:14.5px;margin-bottom:18px}
.modal .err{color:var(--red);font-size:13.5px;font-weight:700;min-height:20px;margin:8px 0}
.modal .linkbtn{margin-top:14px;color:var(--muted);font-size:13.5px;text-decoration:underline;text-underline-offset:3px}

@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr}
  .grid3,.grid4{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  .grid2,.grid3{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
  .sec{padding:56px 16px 80px}
  .hero{padding:36px 16px 96px}
  .hero-ctas .btn{width:100%}

/* ══════════ APP ══════════ */
.app-head{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:rgba(5,7,13,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(190,215,255,.08)}
.prog-pill{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;color:var(--silver)}
.ring{width:34px;height:34px}
.ring circle{fill:none;stroke-width:4}
.ring .bgc{stroke:rgba(255,255,255,.1)}
.ring .fgc{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.view{max-width:760px;margin:0 auto;padding:22px 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom))}
.view-title{font-size:clamp(28px,7vw,38px);font-weight:800;margin:6px 0 8px}
.view-sub{color:var(--muted);font-size:16px;margin-bottom:22px}
.stack>*+*{margin-top:14px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--blue);margin-bottom:14px}
.sec-label{font-family:var(--display);font-size:19px;font-weight:700;margin:30px 0 14px;display:flex;align-items:center;gap:10px}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(6,10,20,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(190,215,255,.1)}
.bnav-in{display:flex;gap:4px;width:100%;max-width:620px}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:14px;font-size:11px;font-weight:700;color:var(--muted);transition:all .18s;min-width:0}
.bnav button .ico{width:22px;height:22px}
.bnav button.on{color:#03101f;background:linear-gradient(180deg,#d9efff,#8ccbff);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 3px 0 #1a5bb8,0 8px 18px rgba(140,203,255,.3);transform:translateY(-2px)}
.bnav button:active{transform:translateY(1px)}

.welcome{position:relative;overflow:hidden;padding:24px}
.welcome::after{content:'';position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(140,203,255,.35),transparent 70%)}
.welcome h2{font-size:clamp(24px,6vw,30px);margin:8px 0 8px;position:relative;z-index:1}
.welcome p{color:var(--silver);position:relative;z-index:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;position:relative;z-index:1}

.path{display:flex;align-items:center;gap:14px;padding:16px;text-align:left;width:100%;transition:transform .18s,border-color .18s}
.path:hover{transform:translateY(-2px);border-color:var(--line2)}
.path .pn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;font-family:var(--display);font-weight:800;color:#03101f;background:linear-gradient(180deg,#d9efff,#8ccbff);box-shadow:0 4px 0 #1a5bb8}
.path h4{font-family:var(--body);font-weight:800;font-size:16px}
.path p{font-size:13.5px;color:var(--muted)}
.path .go{margin-left:auto;color:var(--blue)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.list-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;transition:transform .18s,border-color .18s}
.list-card:hover{transform:translateY(-2px);border-color:var(--line2)}
.list-card .lc-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:rgba(140,203,255,.12);color:var(--blue);font-family:var(--display);font-weight:800}
.list-card.done .lc-ic{background:linear-gradient(180deg,#b8fff0,#5ee6c8);color:#03251e}
.list-card h4{font-family:var(--body);font-weight:800;font-size:16px;margin-bottom:2px}
.list-card p{font-size:13.5px;color:var(--muted)}
.list-card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.list-card .go{margin-left:auto;color:var(--blue);flex-shrink:0}
.minibar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
.minibar i{display:block;height:100%;background:linear-gradient(90deg,#4aa3ff,#5ee6c8);border-radius:5px;transition:width .4s}

.lesson p{color:var(--silver);font-size:16.5px;line-height:1.75;margin:14px 0}
.blk{margin:18px 0}
.blk-head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.ex{border-left:3px solid var(--blue)}
.ex .blk-head{color:var(--blue)}
.ex h4{font-family:var(--body);font-weight:800;font-size:16px;margin-bottom:8px}
.ex p{margin:0;font-size:15.5px;color:var(--silver);line-height:1.7}
.tip{background:rgba(94,230,200,.07);border:1px solid rgba(94,230,200,.28)}
.tip .blk-head{color:var(--mint)}
.warn{background:rgba(255,210,122,.07);border:1px solid rgba(255,210,122,.3)}
.warn .blk-head{color:var(--amber)}
.tip p,.warn p{margin:0;color:var(--silver);font-size:15.5px}
.steps{list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:12px 0 12px 46px;color:var(--silver);font-size:15.5px;border-bottom:1px dashed rgba(190,215,255,.12)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:10px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;color:#03101f;background:linear-gradient(180deg,#d9efff,#8ccbff)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp>div{border-radius:14px;padding:16px;font-size:15px;color:var(--silver)}
.cmp .bad{background:rgba(255,123,143,.07);border:1px solid rgba(255,123,143,.3)}
.cmp .good{background:rgba(94,230,200,.07);border:1px solid rgba(94,230,200,.3)}
.cmp .bad .blk-head{color:var(--red)}.cmp .good .blk-head{color:var(--mint)}
@media (max-width:560px){.cmp{grid-template-columns:1fr}}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:rgba(3,8,18,.55);border:1px solid var(--line);border-radius:14px;padding:14px}
.tool h4{font-family:var(--body);font-weight:800;font-size:15px;color:var(--blue)}
.tool small{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin:2px 0 6px}
.tool p{margin:0!important;font-size:14px!important}
@media (max-width:480px){.tools{grid-template-columns:1fr}}

.quiz .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:13px;margin-top:10px;font-weight:700;font-size:15px;background:rgba(3,8,18,.6);border:1px solid var(--line2);color:var(--white);transition:all .18s}
.quiz .opt:hover:not([disabled]){border-color:var(--blue);transform:translateY(-1px)}
.quiz .opt .ol{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;background:rgba(255,255,255,.08);font-family:var(--display);font-size:13px}
.quiz .opt.right{border-color:var(--mint);background:rgba(94,230,200,.1)}
.quiz .opt.right .ol{background:var(--mint);color:#03251e}
.quiz .opt.wrong{border-color:var(--red);background:rgba(255,123,143,.08)}
.quiz .opt.wrong .ol{background:var(--red);color:#2a0710}
.quiz .opt[disabled]{cursor:default}
.quiz .fb{margin-top:12px;font-size:15px;color:var(--silver)}
.quiz .fb b{color:var(--mint)}
.quiz .fb b.no{color:var(--red)}
.pager{display:flex;gap:10px;margin-top:22px}
.pager .btn{flex:1}

.check{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:14px;border-radius:13px;background:rgba(3,8,18,.5);border:1px solid var(--line);margin-top:8px;color:var(--silver);font-size:15px;transition:all .18s}
.check .box{width:24px;height:24px;border-radius:7px;flex-shrink:0;display:grid;place-items:center;border:2px solid var(--line2);transition:all .2s;margin-top:1px}
.check .box .ico{width:15px;height:15px;stroke-width:3;opacity:0;color:#03251e}
.check.on{border-color:rgba(94,230,200,.4);background:rgba(94,230,200,.06)}
.check.on .box{background:var(--mint);border-color:var(--mint)}
.check.on .box .ico{opacity:1}
.check.on .ct{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(159,178,201,.5)}

.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.meta-grid .stat{text-align:left;padding:14px}
.meta-grid .stat small{display:block;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--blue);margin-bottom:4px}
.meta-grid .stat span{font-size:14.5px;color:var(--silver);font-weight:600}
@media (max-width:480px){.meta-grid{grid-template-columns:1fr}}

.search{position:relative;margin-bottom:12px}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:42px}
.gl-item{padding:13px 0;border-bottom:1px dashed rgba(190,215,255,.12)}
.gl-item:last-child{border-bottom:0}
.gl-item b{font-family:var(--display);color:var(--blue);font-size:15px}
.gl-item p{font-size:14.5px;color:var(--silver);margin-top:2px}
.empty{color:var(--muted);text-align:center;padding:20px;font-size:14.5px}

.prompt-card h4{font-family:var(--body);font-weight:800;font-size:16px;margin:8px 0 10px}
.day{padding:18px}
.day-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.day-head .dn{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.06em;color:#03101f;padding:6px 10px;border-radius:9px;background:linear-gradient(180deg,#d9efff,#8ccbff)}
.day.complete .day-head .dn{background:linear-gradient(180deg,#b8fff0,#5ee6c8);color:#03251e}
.day-head h4{font-family:var(--body);font-weight:800;font-size:16.5px}
.vip{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);padding:4px 9px;border-radius:999px;border:1px solid rgba(255,210,122,.35);background:rgba(255,210,122,.1)}
.fadein{animation:fadein .4s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>

var toastT;
function toast(msg){ var t=$('#toast'); t.textContent=msg||'Copied!'; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); },1800); }

function copyText(text, btn){
  var done=function(){
    toast('Copied — paste it anywhere');
    if(btn){ var o=btn.innerHTML; btn.classList.add('done'); btn.innerHTML=ico('check')+' Copied'; setTimeout(function(){ btn.classList.remove('done'); btn.innerHTML=o; },1800); }
  };
  var fallback=function(){
    try{ var ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length); document.execCommand('copy'); document.body.removeChild(ta); done(); }
    catch(e){ toast('Copy failed — long-press to select'); }
  };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done, fallback); } else { fallback(); }
}

function bindCalc(root){
  if(!root) return;
  var get=function(k){ var v=parseFloat($('[data-k="'+k+'"]',root).value); return isFinite(v)&&v>0?v:0; };
  var run=function(){
    var mins=get('m')*get('t')*4.3, h=mins/60;
    $('[data-o="h"]',root).textContent=(Math.round(h*10)/10).toLocaleString();

    var v=get('v'); $('[data-o="d"]',root).textContent = v ? '$'+Math.round(h*v).toLocaleString() : '—';
  };
  $$('input',root).forEach(function(i){ i.addEventListener('input',run); });

/* ───────── decrypt (VIP keys) ───────── */
function b64d(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function unlock(code){
  var V=CONFIG.vault;
  if(!V) return Promise.resolve(null);
  if(!(window.crypto && crypto.subtle && window.TextEncoder)) return Promise.reject(new Error('nocrypto'));
  var norm=String(code).toUpperCase().replace(/[^A-Z0-9-]/g,'');
  var enc=new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(norm), 'PBKDF2', false, ['deriveKey']).then(function(base){
    var idx=0;
    var next=function(){
      if(idx>=V.k.length) return null;
      var w=V.k[idx++];
      return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(w.s), iterations:V.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt'])
        .then(function(kek){ return crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(w.i)}, kek, b64d(w.w)); })
        .then(function(raw){ return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']); })
        .then(function(ck){ return crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(V.i)}, ck, b64d(V.c)); })
        .then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); }, function(){ return next(); });
    };
    return next();
  });
}

  var stepsTot=0, stepsDone=0; D.recipes.forEach(function(r){ var p=recipeProg(r); stepsTot+=p.total; stepsDone+=p.done; });

function route(){

  var V=$('#view');

function bindView(v,id){
  var V=$('#view');
  $$('[data-nav]',V).forEach(function(b){ b.addEventListener('click',function(){ var t=b.getAttribute('data-nav'); if(t.charAt(0)==='#'){ var el=$(t); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); } else go(t); }); });

  if(v==='home'){
    $$('#finderChips .chip',V).forEach(function(c){ c.addEventListener('click',function(){ var i=+c.getAttribute('data-f'), k=finderSel.indexOf(i); if(k>-1) finderSel.splice(k,1); else finderSel.push(i); c.classList.toggle('on'); finderOut(); bindNavIn($('#finderOut')); }); });
    finderOut(); bindNavIn($('#finderOut'));
    bindCalc($('#hcalc'));
  }
  if(v==='learn' && !id){
    var gq=$('#glQ'); if(gq) gq.addEventListener('input',function(){ $('#glList').innerHTML=glossList(gq.value); });
  }
  if(v==='learn' && id){
    var l=D.lessons.filter(function(x){return x.id===id;})[0]; if(!l) return;
    bindCalc($('#lessonCalc'));
    var mp=$('#mapper');
    if(mp){
      var mo=$('#mapOut');
      var build=function(){
        var g=function(k){ var v=$('[data-m="'+k+'"]',mp).value.trim(); return v; };
        var txt='I run a '+(g('biz')||'[Business Type]')+'. I want to automate this task: '+(g('task')||'[Task]')+'. It starts when '+(g('trig')||'[Trigger]')+'. Today I do it by hand like this: '+(g('steps')||'[Steps]')+'.\n\nI’m a complete beginner. Recommend the simplest way to automate this using free or low-cost tools, then give me step-by-step setup instructions in plain English. Tell me which steps should stay human.';
        mo.innerHTML=fmtPre(txt)+'<button type="button" class="btn btn-ghost btn-sm copy" id="mapCopy">'+ico('copy')+' Copy</button>';
        $('#mapCopy').addEventListener('click',function(){ copyText(txt,this); });
      };
      $$('input,textarea',mp).forEach(function(i){ i.addEventListener('input',build); });
      build();
    }
    var bindQuiz=function(){
      $$('#quiz .opt').forEach(function(b){ b.addEventListener('click',function(){
        if(b.disabled) return; var a=+b.getAttribute('data-o'); S.q[l.id]=a; save();
        $$('#quiz .opt').forEach(function(o){ var i=+o.getAttribute('data-o'); o.disabled=true; if(i===l.quiz.answer) o.classList.add('right'); else if(i===a) o.classList.add('wrong'); });
        $('#qfb').innerHTML=quizFb(l.quiz,a);
        if(!$('#qRetry')){ var r=document.createElement('button'); r.type='button'; r.className='btn btn-ghost btn-sm'; r.id='qRetry'; r.style.marginTop='12px'; r.textContent='Try again'; $('#quiz').appendChild(r); r.addEventListener('click',retry); }
        if(a===l.quiz.answer && !lessonDone(l.id)){ toast('Nice! Mark the lesson complete below.'); }
      }); });
    };
    var retry=function(){ delete S.q[l.id]; save(); $$('#quiz .opt').forEach(function(o){ o.disabled=false; o.classList.remove('right','wrong'); }); $('#qfb').innerHTML=''; var r=$('#qRetry'); if(r) r.remove(); };
    bindQuiz();
    var rt=$('#qRetry'); if(rt) rt.addEventListener('click',retry);
    $('#markDone').addEventListener('click',function(){
      var k=S.l.indexOf(l.id); if(k>-1) S.l.splice(k,1); else S.l.push(l.id); save();
      var d=lessonDone(l.id), b=$('#markDone');
      b.className='btn '+(d?'btn-ghost':'btn-primary')+' btn-block'; b.innerHTML=d?ico('check')+' Completed — tap to undo':'Mark lesson complete';
      if(d) toast('Lesson complete!'); updRing();
    });
  }
  if(v==='automate' && !id){
    $$('[data-cat]',V).forEach(function(c){ c.addEventListener('click',function(){ recipeFilter=c.getAttribute('data-cat'); route(); }); });
  }
  if(v==='automate' && id){
    var r=D.recipes.filter(function(x){return x.id===id;})[0]; if(!r) return;
    $$('[data-step]',V).forEach(function(b){ b.addEventListener('click',function(){
      var i=+b.getAttribute('data-step'), arr=S.r[r.id]||(S.r[r.id]=[]), k=arr.indexOf(i);
      if(k>-1) arr.splice(k,1); else arr.push(i); save();
      var on=arr.indexOf(i)>-1; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on?'true':'false');
      var p=recipeProg(r); $('#rProg').textContent=p.done+'/'+p.total;
      if(p.done===p.total) toast('Automation set up — nice work!'); updRing();
    }); });
    var help='I’m a beginner setting up this automation for my business: '+r.title+'. It starts when: '+r.trigger+'. I plan to use: '+r.tools.join(', ')+'. My business is [Business Type]. I’m stuck on this step: [Paste the step]. Explain exactly what to click and type, one step at a time, in plain English.';
    $$('[data-copy]',V).forEach(function(b){ b.addEventListener('click',function(){ copyText(b.getAttribute('data-copy')==='tpl'?r.template.text:help, b); }); });
  }
  if(v==='prompts'){
    var bindCopies=function(){ $$('[data-pi]',V).forEach(function(b){ b.addEventListener('click',function(){ copyText(D.prompts[+b.getAttribute('data-pi')].text,b); }); }); };
    var pq=$('#pQ'); pq.addEventListener('input',function(){ promptQ=pq.value; $('#pList').innerHTML=promptList(); bindCopies(); });
    $$('[data-pcat]',V).forEach(function(c){ c.addEventListener('click',function(){ promptCat=c.getAttribute('data-pcat'); $$('[data-pcat]',V).forEach(function(x){ x.classList.toggle('on',x===c); }); $('#pList').innerHTML=promptList(); bindCopies(); }); });
    bindCopies();
  }
  if(v==='grow'){
    $$('[data-hook]',V).forEach(function(b){ b.addEventListener('click',function(){ copyText(D.grow.hooks[+b.getAttribute('data-hook')],b); }); });
    $$('[data-post]',V).forEach(function(b){ b.addEventListener('click',function(){ copyText(D.grow.posts[+b.getAttribute('data-post')].text,b); }); });
  }
  if(v==='plan'){
    $$('[data-pt]',V).forEach(function(b){ b.addEventListener('click',function(){
      var k=b.getAttribute('data-pt'); if(S.p[k]) delete S.p[k]; else S.p[k]=true; save();
      var on=!!S.p[k]; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on?'true':'false');
      var di=+k.split('-')[0], d=D.plan[di], all=d.tasks.every(function(x,j){ return planDone(di,j); });
      var card=b.closest('.day'); var was=card.classList.contains('complete'); card.classList.toggle('complete',all);
      if(all && !was) toast('Day '+d.day+' complete!');
      $('.view-sub',V).textContent='Check off tasks as you go. '+totals().daysDone+' of '+D.plan.length+' days complete.';
      updRing();
    }); });
    $('#resetAll').addEventListener('click',function(){ if(confirm('Reset all lesson, recipe, quiz and plan progress on this device?')){ S={l:[],r:{},p:{},q:{}}; save(); route(); toast('Progress reset'); } });
  }
}
function bindNavIn(root){ if(!root) return; $$('[data-nav]',root).forEach(function(b){ b.addEventListener('click',function(){ go(b.getAttribute('data-nav')); }); }); }

/* ═════════════════ BOOT ═════════════════ */
function decodePaid(s){ var r=s.split('').reverse().join(''); return JSON.parse(new TextDecoder().decode(b64d(r))); }
function boot(){
  if(CONFIG.mode==='paid'){
    try{ mountApp(decodePaid(CONFIG.payload), false); }
    catch(e){ document.body.insertAdjacentHTML('beforeend','<div style="position:relative;z-index:2;padding:30px;text-align:center">Please open this file in Safari or Chrome.</div>'); }
    return;
  }
  renderLanding();
  var saved=null; try{ saved=localStorage.getItem('abt_v2_key'); }catch(e){}
  if(saved){ unlock(saved).then(function(d){ if(d) mountApp(d,true); else { try{ localStorage.removeItem('abt_v2_key'); }catch(e){} } }, function(){}); }
}

/* ── light protection (deters casual copying; not a substitute for encryption) ── */
document.addEventListener('contextmenu',function(e){ var t=e.target&&e.target.tagName; if(t!=='INPUT'&&t!=='TEXTAREA') e.preventDefault(); });
document.addEventListener('keydown',function(e){
  var k=(e.key||'').toUpperCase(), inField=/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||'');
  if(k==='F12' || ((e.ctrlKey||e.metaKey) && (k==='U'||k==='S')) || ((e.ctrlKey||e.metaKey) && e.shiftKey && (k==='I'||k==='J'||k==='C')) || ((e.ctrlKey||e.metaKey) && k==='C' && !inField && !(window.getSelection&&String(window.getSelection())))) e.preventDefault();
});

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
